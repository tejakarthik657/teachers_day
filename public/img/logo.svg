<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="30%" stop-color="#dfb76c"/>
      <stop offset="60%" stop-color="#a8792c"/>
      <stop offset="85%" stop-color="#f5dc93"/>
      <stop offset="100%" stop-color="#93651d"/>
    </linearGradient>
    
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5212"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#aa7c28"/>
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#996515" stop-opacity="0"/>
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Outer Decorative Rings -->
    <circle r="230" fill="none" stroke="url(#goldGrad1)" stroke-width="2" opacity="0.6"/>
    <circle r="222" fill="none" stroke="url(#goldGrad2)" stroke-width="1" stroke-dasharray="4, 4" opacity="0.8"/>
    <circle r="214" fill="none" stroke="url(#goldGrad1)" stroke-width="3"/>
    <circle r="160" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5"/>

    <!-- Circular Track for Text -->
    <path id="textCircleTop" d="M -184,0 A 184,184 0 1,1 184,0" fill="none"/>
    <path id="textCircleBottom" d="M 184,0 A 184,184 0 0,1 -184,0" fill="none"/>

    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="url(#goldGrad1)" letter-spacing="4" text-anchor="middle">
      <textPath href="#textCircleTop" startOffset="50%">THE MEMORIES WE KEEP</textPath>
    </text>
    
    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="13" font-weight="600" fill="url(#goldGrad2)" letter-spacing="4" text-anchor="middle">
      <textPath href="#textCircleBottom" startOffset="50%">★ A TEACHER'S DAY TRIBUTE ★</textPath>
    </text>

    <!-- Inner Medallion Background -->
    <circle r="150" fill="none" stroke="url(#goldGrad1)" stroke-width="2" opacity="0.9"/>
    <circle r="144" fill="none" stroke="url(#goldGrad2)" stroke-width="0.8" stroke-dasharray="3, 3" opacity="0.7"/>

    <!-- Decorative Corner / Compass Stars -->
    <path d="M 0,-154 L 3,-148 L 0,-142 L -3,-148 Z" fill="url(#goldGrad1)"/>
    <path d="M 0,154 L 3,148 L 0,142 L -3,148 Z" fill="url(#goldGrad1)"/>
    <path d="M -154,0 L -148,3 L -142,0 L -148,-3 Z" fill="url(#goldGrad1)"/>
    <path d="M 154,0 L 148,3 L 142,0 L 148,-3 Z" fill="url(#goldGrad1)"/>

    <!-- Central Torch of Knowledge & Flame -->
    <g transform="translate(0, -45)">
      <!-- Flame Glow -->
      <circle cx="0" cy="0" r="28" fill="url(#goldGlow)" filter="url(#subtleGlow)"/>
      <!-- Outer Flame -->
      <path d="M 0,-32 C 14,-15 18,2 8,14 C 18,7 16,-6 10,-12 C 7,-3 2,5 -3,9 C -1,3 0,-7 -7,-14 C -12,-3 -10,7 0,22 C -18,12 -16,-10 0,-32 Z" fill="url(#goldGrad1)"/>
      <!-- Inner Flame Core -->
      <path d="M 0,-20 C 7,-9 9,0 4,8 C 8,4 6,-4 3,-7 C 1,-1 -2,3 -5,5 C -3,1 -2,-4 -5,-8 C -8,-2 -6,4 0,14 C -10,8 -9,-6 0,-20 Z" fill="#ffffff" opacity="0.9"/>
      <!-- Torch Bowl -->
      <path d="M -16,22 Q 0,27 16,22 L 11,36 Q 0,39 -11,36 Z" fill="url(#goldGrad2)"/>
      <!-- Torch Handle -->
      <path d="M -7,36 L -5,72 Q 0,74 5,72 L 7,36 Z" fill="url(#goldGrad1)"/>
      <rect x="-9" y="44" width="18" height="3" rx="1.5" fill="url(#goldGrad2)"/>
      <rect x="-8" y="56" width="16" height="2.5" rx="1" fill="url(#goldGrad2)"/>
    </g>

    <!-- Open Book Below Torch -->
    <g transform="translate(0, 30)">
      <!-- Book Pages Outer -->
      <path d="M 0,-8 C -22,-22 -58,-18 -82,-6 C -84,-5 -85,-3 -85,0 L -85,55 C -85,58 -82,60 -79,58 C -56,48 -24,48 0,60 C 24,48 56,48 79,58 C 82,60 85,58 85,55 L 85,0 C 85,-3 84,-5 82,-6 C 58,-18 22,-22 0,-8 Z" fill="none" stroke="url(#goldGrad1)" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Book Binding Center Spine -->
      <line x1="0" y1="-8" x2="0" y2="60" stroke="url(#goldGrad2)" stroke-width="2.5"/>

      <!-- Interior Curved Page Lines -->
      <path d="M -76,4 C -54,-4 -22,-6 -4,3" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>
      <path d="M -74,15 C -52,7 -22,5 -4,14" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>
      <path d="M -72,26 C -50,18 -22,16 -4,25" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>
      <path d="M -70,37 C -48,29 -22,27 -4,36" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>

      <path d="M 76,4 C 54,-4 22,-6 4,3" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>
      <path d="M 74,15 C 52,7 22,5 4,14" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>
      <path d="M 72,26 C 50,18 22,16 4,25" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>
      <path d="M 70,37 C 48,29 22,27 4,36" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.8"/>

      <!-- Ribbon Bookmark -->
      <path d="M 0,20 Q 8,50 14,76 L 6,71 L -2,76 Q 2,45 0,20 Z" fill="url(#goldGrad1)"/>
    </g>

    <!-- Flanking Laurel Branches -->
    <g fill="url(#goldGrad2)">
      <!-- Left Leaves -->
      <path d="M -85,15 Q -105,5 -118,-15 Q -105,-5 -85,15 Z"/>
      <path d="M -95,30 Q -118,25 -130,5 Q -118,12 -95,30 Z"/>
      <path d="M -98,50 Q -122,50 -132,32 Q -120,38 -98,50 Z"/>
      <path d="M -90,70 Q -115,75 -122,60 Q -112,64 -90,70 Z"/>
      <path d="M -75,88 Q -98,96 -104,82 Q -94,86 -75,88 Z"/>

      <!-- Right Leaves -->
      <path d="M 85,15 Q 105,5 118,-15 Q 105,-5 85,15 Z"/>
      <path d="M 95,30 Q 118,25 130,5 Q 118,12 95,30 Z"/>
      <path d="M 98,50 Q 122,50 132,32 Q 120,38 98,50 Z"/>
      <path d="M 90,70 Q 115,75 122,60 Q 112,64 90,70 Z"/>
      <path d="M 75,88 Q 98,96 104,82 Q 94,86 75,88 Z"/>
    </g>

    <!-- Ribbon / Scroll at Bottom -->
    <g transform="translate(0, 115)">
      <path d="M -70,-8 Q 0,-3 70,-8 L 65,10 Q 0,15 -65,10 Z" fill="url(#goldGrad1)" opacity="0.95"/>
      <text y="5" font-family="'Cinzel', serif" font-size="9" font-weight="700" fill="#1a1408" letter-spacing="2" text-anchor="middle">EXCELLENCE IN MENTORSHIP</text>
    </g>
  </g>
</svg>