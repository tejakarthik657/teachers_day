<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>The Memories We Keep — A Teacher's Day Tribute</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, user-scalable=no"
		/>

		<link rel="icon" type="image/svg+xml" href="/img/logo.svg" />

		<meta
			name="description"
			content="An interactive 3D digital commemorative memory book dedicated to a beloved faculty teacher on Teacher's Day."
		/>
		<meta name="author" content="Grateful Students" />

		<!-- Open Graph / Social Sharing -->
		<meta property="og:title" content="The Memories We Keep — A Teacher's Day Tribute" />
		<meta
			property="og:description"
			content="An interactive 3D digital commemorative memory book celebrating a respected teacher and mentor."
		/>
		<meta property="og:type" content="website" />

		<!-- Google Fonts for Harry Potter & Magical Monograph Design -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,700;1,700&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:wght@400;600;700&family=MedievalSharp&family=Uncial+Antiqua&display=swap"
			rel="stylesheet"
		/>

		<style>
			/* Instant loading state */
			body {
				background-color: #0c0a08;
				margin: 0;
				overflow: hidden;
				font-family: "Inter", system-ui, sans-serif;
			}

			.intro-overlay {
				position: absolute;
				z-index: 10;
				inset: 0;
				background-color: #0b0907;
				transition-property: background-color;
				transition-duration: 900ms;
				transition-timing-function: ease-in;
			}

			@keyframes loadingPulse {
				0% {
					opacity: 0.4;
					transform: translateX(-50%) translateY(-50%) scale(0.98);
				}
				50% {
					opacity: 0.9;
					transform: translateX(-50%) translateY(-50%) scale(1.02);
				}
				100% {
					opacity: 0.4;
					transform: translateX(-50%) translateY(-50%) scale(0.98);
				}
			}

			.intro-overlay > .centered-box {
				position: absolute;
				inset: 50%;
				transform: translateX(-50%) translateY(-50%);
				width: 100vmin;
				height: 100vmin;
			}

			.intro-overlay .centered-box > .logo {
				position: absolute;
				top: 42%;
				left: 50%;
				transform: translateX(-50%) translateY(-50%);
				width: 40%;
				height: 40%;
				animation: loadingPulse 2.5s ease-in-out infinite;
				user-select: none;
				opacity: 0;
				transition: opacity 500ms ease-out;
				filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
			}

			.intro-overlay .centered-box > .logo-shine {
				position: absolute;
				top: 42%;
				left: 50%;
				transform: translateX(-50%) translateY(-50%);
				width: 160%;
				height: 160%;
				user-select: none;
				opacity: 0;
				transition:
					opacity 800ms ease-out,
					filter 800ms ease-out;
				filter: brightness(1.2);
			}

			@keyframes infiniteRotateSlow {
				from {
					transform: rotate(0deg);
				}
				to {
					transform: rotate(360deg);
				}
			}

			.intro-overlay .centered-box > .logo-shine > img {
				width: 100%;
				height: 100%;
				animation: infiniteRotateSlow 160s linear infinite;
			}

			.intro-overlay .loading-caption {
				position: absolute;
				top: 76%;
				left: 50%;
				transform: translate(-50%, -50%) scale(1);
				font-family: "Cinzel Decorative", "MedievalSharp", "Cinzel", serif;
				font-size: 17px;
				font-weight: 700;
				letter-spacing: 5px;
				color: #f7df94;
				text-transform: uppercase;
				opacity: 0.9;
				white-space: nowrap;
				text-shadow: 0 0 14px rgba(212, 175, 55, 0.7), 0 0 28px rgba(212, 175, 55, 0.4);
				transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1), top 1.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.6s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 1.6s ease-out;
				will-change: transform, top, opacity, filter;
			}

			.intro-overlay .loading-caption.zoom-in {
				top: 50%;
				transform: translate(-50%, -50%) scale(2.0);
				opacity: 1;
				color: #ffffff;
				text-shadow: 0 0 25px rgba(253, 224, 139, 1), 0 0 50px rgba(212, 175, 55, 0.95), 0 0 90px rgba(212, 175, 55, 0.7);
			}

			.intro-overlay .centered-box > .progress {
				position: absolute;
				top: 86%;
				left: 50%;
				transform: translateX(-50%);
				width: 38%;
				height: 3px;
				background-color: rgba(212, 175, 55, 0.15);
				border-radius: 2px;
				overflow: hidden;
				transition-property: opacity;
				transition-duration: 600ms;
				transition-timing-function: ease-out;
			}

			.intro-overlay .centered-box > .progress > .progress-inner {
				position: absolute;
				top: 0;
				left: 0;
				height: 100%;
				width: 5%;
				background: linear-gradient(90deg, #c5a059, #fde08b, #dfb76c);
				will-change: width;
				transition-property: width;
				transition-duration: 400ms;
				transition-timing-function: ease-out;
				box-shadow:
					0 0 12px rgba(223, 183, 108, 0.7),
					0 0 25px rgba(223, 183, 108, 0.4);
			}
		</style>
	</head>
	<body>
		<div id="flipbook-container">
			<div class="intro-overlay">
				<div class="centered-box">
					<div class="logo-shine">
						<img draggable="false" src="/img/logo-shine.png" alt="Emblem shine" />
					</div>
					<img draggable="false" class="logo" src="/img/csea-logo.png" alt="CSEA Tribute Logo" />
					<div class="loading-caption">CSEA • A Teacher's Day Tribute</div>
					<div class="progress">
						<div class="progress-inner"></div>
					</div>
					<div class="tap-skip-hint">Tap anywhere to open</div>
				</div>
				<div class="developer-attribution" id="developer-attribution">
					<span class="dev-by-text">DEVELOPED BY</span>
					<span class="dev-name-text">DEVFRAMES</span>
					<img src="/img/developer-logo.png" alt="Devframes Logo" class="developer-logo-img" />
				</div>
			</div>
		</div>

		<!-- Subtle Floating Minimal Navigation Dock -->
		<nav class="book-nav-dock" id="book-nav-dock" aria-label="Book Navigation">
			<button id="btn-prev" class="dock-btn" title="Previous Page (Left Arrow)" aria-label="Previous Page">
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="15 18 9 12 15 6"></polyline>
				</svg>
			</button>

			<div class="spread-indicator" id="spread-indicator" title="Open Chapter Navigation">
				<span class="spread-tag" id="spread-tag">Cover</span>
				<span class="spread-title" id="spread-title">The Memories We Keep</span>
			</div>

			<button id="btn-next" class="dock-btn" title="Next Page (Right Arrow)" aria-label="Next Page">
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="9 18 15 12 9 6"></polyline>
				</svg>
			</button>

			<div class="dock-separator"></div>

			<button id="btn-toc" class="dock-btn" title="Table of Contents" aria-label="Table of Contents">
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<line x1="8" y1="6" x2="21" y2="6"></line>
					<line x1="8" y1="12" x2="21" y2="12"></line>
					<line x1="8" y1="18" x2="21" y2="18"></line>
					<line x1="3" y1="6" x2="3.01" y2="6"></line>
					<line x1="3" y1="12" x2="3.01" y2="12"></line>
					<line x1="3" y1="18" x2="3.01" y2="18"></line>
				</svg>
			</button>

			<button id="btn-audio" class="dock-btn" title="Toggle Sound / Ambient Music" aria-label="Toggle Sound">
				<svg id="icon-sound-on" class="sound-icon hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
					<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
				</svg>
				<svg id="icon-sound-off" class="sound-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
					<line x1="23" y1="9" x2="17" y2="15"></line>
					<line x1="17" y1="9" x2="23" y2="15"></line>
				</svg>
			</button>

			<button id="btn-fullscreen" class="dock-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="15 3 21 3 21 9"></polyline>
					<polyline points="9 21 3 21 3 15"></polyline>
					<line x1="21" y1="3" x2="14" y2="10"></line>
					<line x1="3" y1="21" x2="10" y2="14"></line>
				</svg>
			</button>

			<div class="dock-separator"></div>

			<a href="https://devframes.vercel.app/" target="_blank" rel="noopener noreferrer" class="dock-dev-badge" id="dock-dev-badge" title="Visit Devframes (https://devframes.vercel.app/)">
				<span class="dev-label">DEVFRAMES</span>
				<img src="/img/developer-logo.png" alt="Devframes Logo" class="dock-dev-img" />
			</a>
		</nav>

		<!-- Table of Contents Modal Drawer -->
		<div id="toc-drawer" class="toc-drawer hidden" aria-hidden="true">
			<div class="toc-header">
				<div class="toc-title">Table of Contents</div>
				<button id="toc-close-btn" class="toc-close-btn" aria-label="Close Chapters">&times;</button>
			</div>
			<div class="toc-subtitle">The Memories We Keep • Commemorative Monograph</div>
			<ul class="toc-list" id="toc-list">
				<!-- Dynamically populated via main.ts -->
			</ul>
			<div class="toc-footer">Presented with gratitude on Teacher's Day</div>
		</div>

		<!-- User Interaction Hint Toast -->
		<div id="hint-toast" class="hint-toast">
			<span>✦ Drag or click pages to turn &nbsp;•&nbsp; Click photos to zoom in ✦</span>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
